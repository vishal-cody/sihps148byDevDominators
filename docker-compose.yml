version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jocky_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jocky
      POSTGRES_PASSWORD: jocky_pass
      POSTGRES_DB: jocky_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jocky -d jocky_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jocky_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jocky_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jocky:jocky_pass@postgres:5432/jocky_db
      REDIS_URL: redis://redis:6379/0
      JOCKY_ENV: development
      JOCKY_SECRET_KEY: demo_secret_key_change_in_production_32c
      JOCKY_JWT_ALGORITHM: HS256
      JOCKY_JWT_EXPIRE_MINUTES: "1440"
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://frontend:5173"
      SEED_DEMO_DATA: "true"
      SEED_ADMIN_PASSWORD: admin123
    volumes:
      - ./backend:/app
      - ./compiler:/compiler
      - reports_output:/app/reports_output
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        cd /app &&
        alembic upgrade head &&
        python -m app.db.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jocky_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  reports_output:
